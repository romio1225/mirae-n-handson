spring:
  application:
    name: item-bank-api
  datasource:
    url: jdbc:mariadb://localhost:3306/itembank
    username: app
    password: app-pass
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: itembank-pool
      # 커넥션 풀 — 운영 값과 같게 맞춘다.
      # 풀이 작고 대기 시간이 짧아, 트랜잭션을 오래 쥐는 코드가 있으면 금방 고갈된다.
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 성적 집계(grade) — 레거시 legacy/grade-mssql 과 같은 MS-SQL grades DB 를 읽기 전용 계정으로 조회한다.
# 위 spring.datasource(MariaDB · itembank-pool)와 별개의 풀이다. 비밀번호는 환경 변수로만 받는다.
grades:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=grades;encrypt=true;trustServerCertificate=true
    username: readonly
    password: ${GRADES_DB_PASSWORD:}
    maximum-pool-size: 2
    connection-timeout: 3000

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example: INFO
